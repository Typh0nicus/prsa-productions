(function () {
  if (!document.documentElement.classList.contains('route-arrived')) return;
  try {
    var payload = JSON.parse(sessionStorage.getItem('prsa-route') || '{}');
    var layer = document.getElementById('routeTransition');
    var title = document.getElementById('routeTransitionTitle');
    var image = document.getElementById('routeTransitionImage');
    if (payload.title && title) title.textContent = payload.title;
    if (layer && payload.format === 'portrait') layer.classList.add('route-transition--portrait');
    if (image && payload.thumb) {
      image.onerror = () => { if (layer) layer.classList.add('has-no-media'); };
      image.src = payload.thumb;
    } else if (layer) {
      layer.classList.add('has-no-media');
    }
  } catch (error) {}
})();

const CASE_AVATARS = {
  "Stokes Twins": "assets/wordmarks/stoketwins-fig.png",
  "Ben Azelart": "assets/wordmarks/benazelart-fig.png",
  "Sidemen": "assets/wordmarks/sidemen-row.png",

  "KSI": "assets/wordmarks/ksi-row.png",
  "John Nellis": "assets/wordmarks/johnnellis-fig.png",

};

// Hand-curated (NOT pipeline-written): each belt channel's brand color, mirroring index.html CHANNEL_PLATES.
// The screening room's key/counter lights read this via --case-glow; unknown channels fall back to site blue.
const CHANNEL_GLOW = {
  "Stokes Twins": "#E23B47",
  "Ben Azelart": "#18AAC2",
  "Sidemen": "#3A3F48",
  "FutCrunch": "#1EAFDC",
  "KSI": "#2E4FC4",
  "John Nellis": "#C77A3C",
  "Miniminter": "#E0A82C",
};

const byId = (id) => document.getElementById(id);

function fmtStat(value) {
  return String(value || '').replace(/(\d+(?:\.\d+)?)([KMB])/i, (m, num, suf) => {
    const n = parseFloat(num);
    const r = n >= 100 ? Math.round(n) : Math.round(n * 10) / 10;
    return r + suf;
  });
}
const projectHref = (work) => 'case-study.html?id=' + encodeURIComponent(work.id);
const PORTRAIT_VIDEO_IDS = new Set(['gar4U3n-ILY', 'yy-Nt0dRhNI', 'Q1g8PYEFcHc', 'KaUuPNYHFNg', 'vQz3T9Vot1Q', '9DPzZIbp9Ck']);
const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

function handleCaseImageError(image, fallback) {
  const current = image.getAttribute('src') || '';
  if (fallback && image.dataset.fallbackTried !== 'true' && current !== fallback) {
    image.dataset.fallbackTried = 'true';
    image.src = fallback;
    return;
  }
  image.hidden = true;
  const host = image.closest('.video-poster, .next-preview, .cs-menu-project figure, .cs-browser-thumb');
  if (host) host.classList.add('media-unavailable');
}

let works = FALLBACK_WORKS;

function splitCaseTitle(el) {
  const words = (el.textContent || '').trim().split(/\s+/);
  el.textContent = '';
  words.forEach((word, index) => {
    const mask = document.createElement('span');
    mask.className = 'w-mask';
    const inner = document.createElement('span');
    inner.className = 'w';
    inner.style.setProperty('--wi', index);
    inner.textContent = word;
    mask.appendChild(inner);
    el.appendChild(mask);
    if (index < words.length - 1) el.appendChild(document.createTextNode(' '));
  });
}

function selectWork() {
  const params = new URLSearchParams(location.search);
  const requested = params.get('id') || location.hash.replace('#', '');
  return works.find((work) => work.id === requested) || works[0];
}

function caseThumb(work) {
  const portrait = work.format === 'portrait' || PORTRAIT_VIDEO_IDS.has(work.id);
  return portrait ? `https://i.ytimg.com/vi/${work.id}/oar2.jpg` : (work.thumb || `https://i.ytimg.com/vi/${work.id}/maxresdefault.jpg`);
}

function renderCase() {
  const work = selectWork();
  const index = works.findIndex((item) => item.id === work.id);
  const next = works[(index + 1) % works.length];
  const portrait = work.format === 'portrait' || PORTRAIT_VIDEO_IDS.has(work.id);
  const thumb = caseThumb(work);
  const nextPortrait = next.format === 'portrait' || PORTRAIT_VIDEO_IDS.has(next.id);
  const nextThumb = caseThumb(next);

  document.documentElement.style.setProperty('--case-glow', CHANNEL_GLOW[work.channel] || '#2F6BFF');
  document.title = work.title + ' — Prša Productions';
  const description = document.querySelector('meta[name="description"]');
  const projectDescription = work.title + ' — selected editing work by Prša Productions.';
  if (description) description.content = projectDescription;
  byId('csOgTitle').content = document.title;
  byId('csOgDescription').content = projectDescription;
  byId('csOgImage').content = thumb;
  byId('csOgImageAlt').content = work.title + ' thumbnail';
  byId('csTwitterTitle').content = document.title;
  byId('csTwitterDescription').content = projectDescription;
  byId('csTwitterImage').content = thumb;
  byId('csTwitterImageAlt').content = work.title + ' thumbnail';
  const title = byId('csTitle');
  title.textContent = work.title;
  splitCaseTitle(title);
  const facts = [];
  if (work.channel) {
    const avatar = CASE_AVATARS[work.channel]
      ? '<img class="cs-fact-avatar" src="' + escapeHtml(CASE_AVATARS[work.channel]) + '" alt="" loading="lazy" decoding="async" onerror="this.hidden=true" />'
      : '';
    facts.push({ label: 'Channel', html: avatar + escapeHtml(work.channel) });
  }
  if (work.role) facts.push({ label: 'Role', html: escapeHtml(work.role) });
  facts.push({ label: 'Views', html: escapeHtml(fmtStat(work.views) || '—') });
  facts.push({ label: 'Likes', html: escapeHtml(fmtStat(work.likes) || '—') });
  byId('csFactsGrid').innerHTML = facts.map((fact) => '<div class="cs-fact"><span>' + fact.label + '</span><strong>' + fact.html + '</strong></div>').join('');
  byId('csMenuTitle').textContent = work.title;
  const menuImage = byId('csMenuImage');
  menuImage.dataset.fallbackTried = 'false';
  menuImage.hidden = false;
  menuImage.closest('figure')?.classList.remove('media-unavailable');
  menuImage.onerror = () => handleCaseImageError(menuImage, work.thumbFallback || `https://i.ytimg.com/vi/${work.id}/hqdefault.jpg`);
  menuImage.src = thumb;
  const shell = byId('videoShell');
  shell.classList.toggle('is-portrait', portrait);
  shell.classList.remove('is-playing');
  shell.innerHTML = `<a class="video-poster" href="${escapeHtml(work.url)}" target="_blank" rel="noopener noreferrer" aria-label="Play ${escapeHtml(work.title)}">
    <img src="${escapeHtml(thumb)}" alt="${escapeHtml(work.title)}" loading="eager" onerror="handleCaseImageError(this,'${escapeHtml(work.thumbFallback || `https://i.ytimg.com/vi/${work.id}/hqdefault.jpg`)}')">
    <span class="video-play" aria-hidden="true"><i></i></span>
  </a>`;
  // Inline playback: the poster stays an honest external link (no-JS, modified clicks, media failures),
  // but a plain click plays the edit right here in the shell. file:// is excluded - YouTube embeds
  // reject referer-less origins with error 153, so local viewing keeps the external-link behavior.
  const poster = shell.querySelector('.video-poster');
  if (location.protocol !== 'file:') poster.addEventListener('click', (event) => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (poster.classList.contains('media-unavailable')) return;
    event.preventDefault();
    shell.classList.add('is-playing');
    shell.innerHTML = `<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(work.id)}?autoplay=1&rel=0&playsinline=1" title="${escapeHtml(work.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
  });
  byId('watchLink').href = work.url;
  byId('nextProject').href = projectHref(next);
  byId('nextProject').classList.toggle('next-link--portrait', nextPortrait);
  byId('nextProject').dataset.projectTransition = '';
  byId('nextProject').dataset.projectTitle = next.title;
  byId('nextProject').dataset.projectFormat = nextPortrait ? 'portrait' : 'landscape';
  byId('nextProject').dataset.projectThumb = nextThumb;
  byId('nextProject').dataset.projectFallback = next.thumbFallback || `https://i.ytimg.com/vi/${next.id}/hqdefault.jpg`;
  byId('nextTitle').textContent = next.title;
  const nextImage = byId('nextThumb');
  nextImage.dataset.fallbackTried = 'false';
  nextImage.hidden = false;
  nextImage.closest('.next-preview')?.classList.remove('media-unavailable');
  nextImage.onerror = () => handleCaseImageError(nextImage, next.thumbFallback || `https://i.ytimg.com/vi/${next.id}/hqdefault.jpg`);
  nextImage.src = nextThumb;
  const scopeSection = byId('csScope');
  if (work.scope) {
    byId('csScopeText').textContent = work.scope;
    scopeSection.hidden = false;
  } else {
    scopeSection.hidden = true;
  }
  initPosterMotion();
  const coveredArrival = document.documentElement.classList.contains('route-arrived');
  setTimeout(() => requestAnimationFrame(() => document.body.classList.add('cs-ready')), coveredArrival ? 300 : 0);
}

function departRouteCover() {
  try { sessionStorage.removeItem('prsa-route'); } catch (error) {}
  if (!document.documentElement.classList.contains('route-arrived')) return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    setTimeout(() => {
      document.documentElement.classList.add('route-depart');
      setTimeout(() => {
        document.documentElement.classList.add('route-gone');
        document.documentElement.classList.remove('route-arrived', 'route-depart');
      }, 880);
    }, 420);
  }));
}

function initPosterMotion() {
  const stage = byId('videoShell');
  if (!stage || stage.dataset.motionBound || matchMedia('(prefers-reduced-motion: reduce)').matches || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  stage.dataset.motionBound = 'true';
  let frame = 0;
  stage.addEventListener('pointermove', (event) => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const rect = stage.getBoundingClientRect();
      stage.style.setProperty('--poster-x', ((((event.clientX - rect.left) / rect.width) - .5) * -10).toFixed(2) + 'px');
      stage.style.setProperty('--poster-y', ((((event.clientY - rect.top) / rect.height) - .5) * -8).toFixed(2) + 'px');
    });
  }, { passive: true });
  stage.addEventListener('pointerleave', () => {
    stage.style.setProperty('--poster-x', '0px');
    stage.style.setProperty('--poster-y', '0px');
  });
}

function initCaseMenu() {
  const nav = byId('nav');
  const mnav = byId('mnav');
  const menuBtn = byId('menuBtn');
  const menuClose = byId('mClose');
  if (!nav || !mnav || !menuBtn || !menuClose) return;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pageRegions = [nav, document.querySelector('main'), document.querySelector('footer')].filter(Boolean);
  let exitTimer = 0;

  const openMenu = () => {
    clearTimeout(exitTimer);
    mnav.classList.remove('exiting');
    mnav.classList.add('open');
    mnav.setAttribute('aria-hidden', 'false');
    mnav.removeAttribute('inert');
    menuBtn.setAttribute('aria-expanded', 'true');
    document.body.classList.add('menu-open');
    pageRegions.forEach((region) => { region.inert = true; });
    setTimeout(() => menuClose.focus({ preventScroll: true }), reduceMotion ? 0 : 40);
  };

  const closeMenu = (restoreFocus = false) => {
    if (mnav.contains(document.activeElement)) document.activeElement.blur();
    mnav.classList.remove('open', 'exiting');
    mnav.setAttribute('aria-hidden', 'true');
    mnav.setAttribute('inert', '');
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('menu-open');
    pageRegions.forEach((region) => { region.inert = false; });
    if (restoreFocus) menuBtn.focus({ preventScroll: true });
  };

  const exitMenu = (restoreFocus = false, after) => {
    if (!mnav.classList.contains('open') || mnav.classList.contains('exiting')) return;
    mnav.classList.add('exiting');
    exitTimer = setTimeout(() => {
      closeMenu(restoreFocus);
      if (after) after();
    }, reduceMotion ? 0 : 340);
  };

  mnav.setAttribute('inert', '');
  menuBtn.addEventListener('click', openMenu);
  menuClose.addEventListener('click', () => exitMenu(true));

  mnav.querySelectorAll('[data-case-menu-link]').forEach((link) => {
    link.addEventListener('click', (event) => {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || !mnav.classList.contains('open')) return;
      const destination = link.href;
      if (!destination || mnav.classList.contains('exiting')) return;
      event.preventDefault();
      exitMenu(false, () => window.location.assign(destination));
    });
  });

  document.addEventListener('keydown', (event) => {
    if (!mnav.classList.contains('open')) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      exitMenu(true);
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = Array.from(mnav.querySelectorAll('a[href],button:not([disabled])')).filter((element) => element.offsetParent !== null);
    if (!focusable.length) {
      event.preventDefault();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus({ preventScroll: true });
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus({ preventScroll: true });
    }
  });

  window.addEventListener('pageshow', () => closeMenu(false));
  window.addEventListener('pagehide', () => clearTimeout(exitTimer));
}

async function hydrateWorks() {
  if (location.protocol === 'file:') { renderCase(); return; } // fetch() can't run on file:// - the pipeline-written fallback IS the data there
  try {
    const response = await fetch('works.json', { cache: 'no-store' });
    if (response.ok) {
      const data = await response.json();
      if (Array.isArray(data.featured) && data.featured.length) {
        works = data.featured;
      }
    }
  } catch (error) {
    works = FALLBACK_WORKS;
  }
  renderCase();
}

function initChrome() {
  const nav = byId('nav');
  const stageBand = byId('posterSection');
  // Band-aware wordmark (same midline law as the homepage): the ink wordmark flips white
  // while the nav midline crosses the dark screening band.
  const onScroll = () => {
    nav.classList.toggle('scrolled', window.scrollY > 16);
    if (stageBand) {
      const rect = stageBand.getBoundingClientRect();
      nav.classList.toggle('over-dark', rect.top <= 44 && rect.bottom > 44);
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  onScroll();

  byId('yr').textContent = new Date().getFullYear();
}

initChrome();
initCaseMenu();
renderCase();
departRouteCover();
hydrateWorks();
</script>
</body>
</html>
